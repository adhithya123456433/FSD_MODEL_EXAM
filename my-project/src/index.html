<!DOCTYPE html>
<html>
<head>
    <title>Blood Donation Registration</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        input[type="radio"] {
            width: auto;
            display: inline;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
        }

        #message, #result {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Blood Donation Registration</h2>

    <form>

        <label>Donor Name</label>
        <input type="text" id="name">

        <label>Age</label>
        <input type="number" id="age">

        <label>Email</label>
        <input type="text" id="email">

        <label>Phone Number</label>
        <input type="text" id="phone">

        <label>Blood Group</label>
        <select id="bloodgroup">
            <option value="">Select</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>
        </select>

        <label>Gender</label>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female

        <label>Donation Date (DD/MM/YYYY)</label>
        <input type="text" id="date">

        <button type="button" onclick="register()">Register</button>
        <button type="reset">Reset</button>

    </form>

    <div id="message"></div>

</div>

<div class="container">

    <h2>Search / Delete Donor</h2>

    <label>Donor ID</label>
    <input type="number" id="searchId">

    <button type="button" onclick="searchDonor()">Search</button>
    <button type="button" onclick="deleteDonor()">Delete</button>

    <div id="result"></div>

</div>

<script>

async function register() {

    let name = document.getElementById("name").value;
    let age = document.getElementById("age").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;
    let bloodgroup = document.getElementById("bloodgroup").value;
    let gender = document.querySelector('input[name="gender"]:checked');
    let date = document.getElementById("date").value;

    let message = document.getElementById("message");


    if (name == "" || age == "" || email == "" || phone == "" ||
        bloodgroup == "" || gender == null || date == "") {

        message.innerHTML = "All fields are required";
        message.style.color = "red";

        return;
    }


    let namePattern = /^[a-zA-Z\s]+$/;

    if (!namePattern.test(name)) {

        message.innerHTML = "Name should contain only letters and spaces";
        message.style.color = "red";

        return;
    }


    if (age < 18 || age > 65) {

        message.innerHTML = "Age must be between 18 and 65";
        message.style.color = "red";

        return;
    }


    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email)) {

        message.innerHTML = "Enter a valid email";
        message.style.color = "red";

        return;
    }


    let phonePattern = /^[0-9]{10}$/;

    if (!phonePattern.test(phone)) {

        message.innerHTML = "Enter a valid 10 digit phone number";
        message.style.color = "red";

        return;
    }


    let datePattern = /^[0-9]{2}\/[0-9]{2}\/[0-9]{4}$/;

    if (!datePattern.test(date)) {

        message.innerHTML = "Enter date in DD/MM/YYYY format";
        message.style.color = "red";

        return;
    }


    let parts = date.split("/");
    let selectedDate = new Date(parts[2], parts[1] - 1, parts[0]);
    let today = new Date();
    today.setHours(0, 0, 0, 0);

    if (selectedDate < today) {

        message.innerHTML = "Date cannot be in the past";
        message.style.color = "red";

        return;
    }


    let response = await fetch("/donor", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            name: name,
            age: age,
            email: email,
            phone: phone,
            bloodGroup: bloodgroup,
            gender: gender.value,
            date: date
        })
    });

    let text = await response.text();

    if (response.ok) {
        message.innerHTML = text;
        message.style.color = "green";
    }
    else {
        message.innerHTML = text;
        message.style.color = "red";
    }

}


async function searchDonor() {

    let id = document.getElementById("searchId").value;
    let result = document.getElementById("result");

    if (id == "") {
        result.innerHTML = "Enter donor ID";
        result.style.color = "red";
        return;
    }

    let response = await fetch("/donor/" + id);

    if (!response.ok) {
        result.innerHTML = "Donor not found";
        result.style.color = "red";
        return;
    }

    let d = await response.json();

    result.innerHTML = "Name: " + d.name + "<br>Age: " + d.age +
        "<br>Email: " + d.email + "<br>Phone: " + d.phone +
        "<br>Blood Group: " + d.bloodGroup + "<br>Gender: " + d.gender +
        "<br>Date: " + d.date;
    result.style.color = "black";

}


async function deleteDonor() {

    let id = document.getElementById("searchId").value;
    let result = document.getElementById("result");

    if (id == "") {
        result.innerHTML = "Enter donor ID";
        result.style.color = "red";
        return;
    }

    let response = await fetch("/donor/" + id, { method: "DELETE" });
    let text = await response.text();

    result.innerHTML = text;

    if (response.ok) {
        result.style.color = "green";
    }
    else {
        result.style.color = "red";
    }

}

</script>

</body>
</html>
